<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nimbus</title>

    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div class="page">

        <main class="app">

            <!-- ================= HERO ================= -->

            <section class="hero">

                <h1 class="logo">
                    Nimbus
                </h1>

                <p class="tagline">
                    Beautiful weather, beautifully presented.
                </p>

            </section>

            <!-- ================= SEARCH ================= -->

            <section class="search-section">

                <form class="search-box" id="search-form">

                    <span class="search-icon">
                        🔍
                    </span>

                    <input id="search-input" class="search-input" type="search" placeholder="Search any city..."
                        autocomplete="off" spellcheck="false">

                </form>

            </section>

            <!-- ================= CURRENT WEATHER ================= -->

            <section class="weather-card">

                <p id="greeting" class="greeting">
                    Good Morning
                </p>

                <h2 id="temperature" class="temperature">
                    --°
                </h2>

                <p id="feels-like" class="feels-like">
                    Feels like --°
                </p>

                <h3 id="city" class="city">
                    Search for a city
                </h3>

                <p id="condition" class="condition">
                    --
                </p>

                <p id="updated-time" class="updated-time">
                    Updated --
                </p>

            </section>

            <!-- ================= HIGHLIGHTS ================= -->

            <section class="highlights">

                <div class="highlight-card">
                    <h4>Humidity</h4>
                    <p id="humidity">--%</p>
                </div>

                <div class="highlight-card">
                    <h4>Wind</h4>
                    <p id="wind-speed">-- km/h</p>
                </div>

                <div class="highlight-card">
                    <h4>Pressure</h4>
                    <p id="pressure">-- hPa</p>
                </div>

                <div class="highlight-card">
                    <h4>Visibility</h4>
                    <p id="visibility">-- km</p>
                </div>

                <div class="highlight-card">
                    <h4>UV Index</h4>
                    <p id="uv-index">--</p>
                </div>

                <div class="highlight-card">
                    <h4>Sunrise</h4>
                    <p id="sunrise">--:--</p>
                </div>

            </section>

            <!-- ================= FORECAST ================= -->

            <section class="forecast">

                <h2 class="section-title">
                    7-Day Forecast
                </h2>

                <div id="forecast-container">

                    <!-- Forecast cards will be inserted here -->

                </div>

            </section>

            <!-- ================= CHART ================= -->

            <section class="chart-section">

                <h2 class="section-title">
                    Hourly Temperature
                </h2>
                <div class="chart-container">
                    <canvas id="temperature-chart"></canvas>
                </div>
            </section>

        </main>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script type="module" src="./js/app.js"></script>

</body>

</html>
